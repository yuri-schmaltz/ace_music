name: launcher-checks

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: launcher checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # history completo, para que o portao possa comparar com origin/main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify the launcher
        # Roda o portao de verificacao completo: sintaxe, check de contrato contra
        # o main mais recente dos dois upstreams (nos dois lados), pre-flight de
        # porta, coerencia do fluxo do Pinokio, verdade do README e os artefatos
        # do projeto. Clona os upstreams sozinho, nao precisa de secrets nem de GPU.
        run: node tools/verify.js --base origin/main
